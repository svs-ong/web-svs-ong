<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" width="600" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Where the copies of the cats live</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a6a5c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="600" height="640" rx="18" fill="#fff8f0"/>

  <!-- Browsers -->
  <rect x="24" y="24" width="264" height="132" rx="14" fill="#e3f0fb" stroke="#4a90c2" stroke-width="2"/>
  <text x="156" y="58" text-anchor="middle" font-size="20" font-weight="700" fill="#1f3f5b">Ana's browser</text>
  <text x="156" y="88" text-anchor="middle" font-size="16" fill="#1f3f5b">router cache · private</text>
  <text x="156" y="112" text-anchor="middle" font-size="14" fill="#41627d">keeps visited pages</text>
  <text x="156" y="132" text-anchor="middle" font-size="14" fill="#41627d">for the "stale" time</text>

  <rect x="312" y="24" width="264" height="132" rx="14" fill="#e3f0fb" stroke="#4a90c2" stroke-width="2"/>
  <text x="444" y="58" text-anchor="middle" font-size="20" font-weight="700" fill="#1f3f5b">Bogdan's browser</text>
  <text x="444" y="88" text-anchor="middle" font-size="16" fill="#1f3f5b">router cache · private</text>
  <text x="444" y="112" text-anchor="middle" font-size="14" fill="#41627d">his own copy,</text>
  <text x="444" y="132" text-anchor="middle" font-size="14" fill="#41627d">never Ana's</text>

  <!-- arrows browsers -> server -->
  <line x1="156" y1="160" x2="156" y2="226" stroke="#7a6a5c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="444" y1="160" x2="444" y2="226" stroke="#7a6a5c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="300" y="186" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="700">hit in the browser:</text>
  <text x="300" y="206" text-anchor="middle" font-size="14" fill="#2e7d32">no request at all</text>

  <!-- Server -->
  <rect x="24" y="232" width="552" height="150" rx="14" fill="#fde6d4" stroke="#e8772e" stroke-width="2"/>
  <text x="300" y="268" text-anchor="middle" font-size="20" font-weight="700" fill="#5b2d0c">Next.js server · port 3001</text>
  <text x="300" y="298" text-anchor="middle" font-size="16" fill="#5b2d0c">"use cache" · one shared copy for everyone</text>
  <text x="300" y="324" text-anchor="middle" font-size="14" fill="#7a4a26">fresh until "revalidate", refreshed in the background,</text>
  <text x="300" y="344" text-anchor="middle" font-size="14" fill="#7a4a26">thrown away by "expire" or updateTag()</text>
  <text x="300" y="368" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="700">hit on the server: about 50 ms, no API call</text>

  <!-- arrow server -> api -->
  <line x1="300" y1="386" x2="300" y2="452" stroke="#7a6a5c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="316" y="420" font-size="14" fill="#c0392b" font-weight="700">miss: + 500 ms</text>

  <!-- API -->
  <rect x="24" y="458" width="552" height="112" rx="14" fill="#ece7f6" stroke="#7a5fb0" stroke-width="2"/>
  <text x="300" y="494" text-anchor="middle" font-size="20" font-weight="700" fill="#35245c">Cats API · port 3000</text>
  <text x="300" y="522" text-anchor="middle" font-size="16" fill="#35245c">homework/server · the source of truth</text>
  <text x="300" y="548" text-anchor="middle" font-size="14" fill="#584585">every call waits 500 ms and prints a log line</text>

  <text x="300" y="604" text-anchor="middle" font-size="15" fill="#5c4d40">The closer to the user a copy sits, the faster a hit,</text>
  <text x="300" y="626" text-anchor="middle" font-size="15" fill="#5c4d40">but the fewer people share it.</text>
</svg>
