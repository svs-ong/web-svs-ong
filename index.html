<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Position Property Example</title>
    <style>
      .container {
        height: 200px;
        position: relative;
        background-color: lightgrey;
      }

      .relative-element {
        position: relative;
        top: 20px;
        left: 20px;
        background-color: lightblue;
        padding: 10px;
      }

      .absolute-element {
        position: absolute;
        top: 50px;
        left: 50px;
        background-color: lightgreen;
        padding: 10px;
      }

      .fixed-element {
        position: fixed;
        top: 10px;
        right: 10px;
        background-color: lightcoral;
        padding: 10px;
      }

      .sticky-element {
        position: sticky;
        top: 0;
        background-color: lightgoldenrodyellow;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="relative-element">Relative Element</div>
      <div class="absolute-element">Absolute Element</div>
      <div class="sticky-element">Sticky Element</div>
    </div>
    <div class="fixed-element">Fixed Element</div>
    <p>Scroll down to see the sticky element in action.</p>
    <div style="height: 1000px;"></div>
  </body>
</html>
