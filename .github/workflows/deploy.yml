name: Deploy Docsify to Firebase Hosting

on:
  push:
    branches:
      - main # or your default branch
      - fix

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Generate sitemap
        run: npx docsify-sitemap local -u https://web.svs.ong/ -b ./site -f ./site/sitemap.xml -i

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.SVS_ONG_PROD_DOCSIFY_SERVICE_ACCOUNT_KEY }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only hosting --project svs-ong-prod --non-interactive
